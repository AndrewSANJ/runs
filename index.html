<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Утренние пробежки</title>

<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#14181f">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Пробежки">

<style>
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0;
    height: 100%;
    overflow: hidden;
    background: #14181f;
  }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
    color: #e5e9ef;
    -webkit-font-smoothing: antialiased;
    -webkit-tap-highlight-color: transparent;
  }

  /* ---------- каркас: шапка / список / подвал ---------- */
  .wrap {
    display: flex;
    flex-direction: column;
    height: 100vh;
    height: 100dvh;
    max-width: 720px;
    margin: 0 auto;
    padding-top: env(safe-area-inset-top);
  }

  .head {
    flex-shrink: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 4px;
    padding: 18px 16px 12px;
    text-align: center;
    background: #14181f;
    border-bottom: 1px solid #232a34;
    z-index: 2;
  }
  h1 {
    font-size: 26px;
    font-weight: 700;
    letter-spacing: -0.6px;
    margin: 0;
    background: linear-gradient(180deg, #ffffff 0%, #a8b3c2 100%);
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
    color: #e5e9ef;
  }
  .status {
    font-size: 12px;
    color: #6b7280;
    min-height: 14px;
    white-space: pre-line;
    text-align: center;
    line-height: 1.3;
  }

  .list-container {
    flex: 1 1 auto;
    overflow-y: auto;
    -webkit-overflow-scrolling: touch;
    padding: 10px 12px 20px;
    scrollbar-width: thin;
    scrollbar-color: #3a4250 transparent;
  }
  .list-container::-webkit-scrollbar { width: 8px; }
  .list-container::-webkit-scrollbar-track { background: transparent; }
  .list-container::-webkit-scrollbar-thumb {
    background: #3a4250; border-radius: 4px;
  }

  .footer {
    flex-shrink: 0;
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 10px;
    padding: 12px 16px calc(12px + env(safe-area-inset-bottom));
    background: #14181f;
    border-top: 1px solid #232a34;
    z-index: 2;
  }

  /* ---------- строки ---------- */
  .row {
    display: flex; align-items: center; gap: 10px;
    padding: 10px 12px; margin-bottom: 6px;
    border-radius: 10px;
    border-left: 4px solid transparent;
    font-size: 14px; line-height: 1.2;
    cursor: pointer; user-select: none;
    transition: box-shadow .15s ease, transform .15s ease, background .15s ease;
  }
  .row:hover {
    box-shadow: 0 4px 14px rgba(0,0,0,.45);
    transform: translateY(-1px);
  }
  .row:focus-visible { outline: 2px solid #4a8bff; outline-offset: 1px; }
  .row.yellow { background: #3b3416; border-left-color: #d4a900; }
  .row.green  { background: #163a22; border-left-color: #35b85a; }
  .row.red    { background: #3d1c1c; border-left-color: #e05555; }
  .row.editing {
    background: #232a34;
    border-left-color: #64748b;
    cursor: default;
    padding: 10px 12px;
    box-shadow: 0 6px 20px rgba(0,0,0,.5);
    transform: none;
  }

  .date { flex: 0 0 132px; font-weight: 600; color: #c7cfda; white-space: nowrap; }
  .date.today { color: #6ea8ff; }
  .dist {
    flex: 0 0 84px; text-align: right; font-weight: 600;
    font-variant-numeric: tabular-nums; white-space: nowrap;
  }
  .dist.empty { color: #5f6875; font-weight: 400; }
  .note {
    flex: 1 1 auto; color: #b6bec9;
    overflow: hidden; text-overflow: ellipsis;
    white-space: nowrap; min-width: 0;
  }
  .note.empty { color: transparent; }
  .week-divider {
    height: 1px;
    background: linear-gradient(90deg, transparent, #3a4250 20%, #3a4250 80%, transparent);
    margin: 14px 4px;
  }

  .inp {
    font: inherit; font-size: 14px; padding: 8px 10px;
    border: 1px solid #3a4250; border-radius: 8px;
    background: #1a1f27; color: #e5e9ef; min-width: 0;
    transition: border-color .15s ease, box-shadow .15s ease;
  }
  .inp:focus {
    outline: none; border-color: #4a8bff;
    box-shadow: 0 0 0 2px rgba(74,139,255,.25);
  }
  .inp.invalid { border-color: #e05555; box-shadow: 0 0 0 2px rgba(224,85,85,.25); }
  .inp.dist-inp { flex: 0 0 84px; text-align: right; }
  .inp.note-inp { flex: 1 1 auto; }

  .note-trigger {
    cursor: pointer;
    display: flex; align-items: center;
    padding: 8px 10px;
    border: 1px solid #3a4250; border-radius: 8px;
    background: #1a1f27;
    color: #c7cfda;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    user-select: none;
    transition: border-color .15s ease, background .15s ease;
  }
  .note-trigger:hover { background: #232a34; border-color: #4a5568; }
  .note-trigger.empty { color: #5f6875; font-style: italic; }
  .note-trigger:focus-visible { outline: 2px solid #4a8bff; outline-offset: 1px; }

  .btn {
    font: inherit; font-size: 13px; font-weight: 600;
    padding: 8px 18px; border-radius: 10px;
    border: 1px solid #3a4250; background: #232a34;
    color: #c7cfda; cursor: pointer; white-space: nowrap;
    transition: all .15s ease;
  }
  .btn:hover {
    background: #2b3340; border-color: #4a5568;
    transform: translateY(-1px);
  }
  .btn:active { transform: translateY(0); }
  .btn.primary {
    background: #2f6fdd; border-color: #2f6fdd; color: #fff;
    box-shadow: 0 2px 10px rgba(47,111,221,.4);
  }
  .btn.primary:hover {
    background: #3b7ce6;
    box-shadow: 0 4px 14px rgba(47,111,221,.5);
  }
  .btn:disabled { opacity: .45; cursor: not-allowed; transform: none; }
  .btn.attention {
    animation: pulse 1.6s ease-in-out infinite;
    background: #2f6fdd; border-color: #2f6fdd; color: #fff;
  }
  @keyframes pulse {
    0%, 100% { box-shadow: 0 0 0 0 rgba(47,111,221,.7); }
    50% { box-shadow: 0 0 0 10px rgba(47,111,221,0); }
  }

  /* ---------- модалка ---------- */
  .modal-backdrop {
    position: fixed; inset: 0;
    background: rgba(0,0,0,.7);
    backdrop-filter: blur(4px);
    -webkit-backdrop-filter: blur(4px);
    display: flex; align-items: center; justify-content: center;
    padding: 16px;
    z-index: 1000;
    animation: fadeIn .15s ease;
  }
  .modal-backdrop.hidden { display: none; }
  @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

  .modal {
    background: #1f2530;
    border: 1px solid #3a4250;
    border-radius: 14px;
    padding: 20px;
    max-width: 640px;
    width: 100%;
    max-height: 90vh;
    display: flex; flex-direction: column;
    gap: 14px;
    box-shadow: 0 24px 70px rgba(0,0,0,.7);
  }
  .modal-title { font-size: 17px; font-weight: 600; color: #e5e9ef; }
  .modal-title small { font-weight: 400; color: #8a94a3; margin-left: 6px; font-size: 13px; }
  .modal-textarea {
    font: inherit; font-size: 16px; line-height: 1.45;
    padding: 14px;
    border: 1px solid #3a4250; border-radius: 10px;
    background: #14181f; color: #e5e9ef;
    min-height: 260px; width: 100%; resize: vertical;
  }
  .modal-textarea:focus {
    outline: none; border-color: #4a8bff;
    box-shadow: 0 0 0 2px rgba(74,139,255,.25);
  }
  .modal-actions { display: flex; gap: 8px; justify-content: flex-end; }

  /* ---------- мобильная версия ---------- */
  @media (max-width: 640px) {
    h1 { font-size: 28px; }
    .head { padding: 16px 14px 10px; }

    .list-container { padding: 8px 10px 16px; }

    .row { padding: 14px 14px; gap: 10px; font-size: 16px; margin-bottom: 8px; border-radius: 12px; }
    .date { flex: 0 0 140px; font-size: 15px; }
    .dist { flex: 0 0 90px; font-size: 16px; }
    .note { font-size: 15px; }
    .week-divider { margin: 16px 4px; }

    .inp { font-size: 16px; padding: 10px 12px; }
    .inp.dist-inp { flex: 0 0 90px; }
    .note-trigger { padding: 10px 12px; font-size: 15px; }

    .btn { font-size: 15px; padding: 10px 22px; }
    .footer { gap: 12px; padding: 14px 16px calc(14px + env(safe-area-inset-bottom)); }

    .modal { padding: 18px; gap: 14px; }
    .modal-title { font-size: 18px; }
    .modal-textarea { font-size: 17px; min-height: 45vh; padding: 14px; }

    .row.editing { flex-wrap: wrap; padding: 12px; }
    .row.editing .date {
      flex: 0 0 100%;
      font-size: 13px;
      color: #8a94a3;
      margin-bottom: 4px;
    }
    .row.editing .inp.dist-inp { flex: 1 1 100px; }
    .row.editing .note-trigger { flex: 2 1 140px; }
    .row.editing .btn { flex: 0 0 auto; }
  }
</style>
</head>
<body>
<div class="wrap">
  <header class="head">
    <h1>Утренние пробежки</h1>
    <div id="status" class="status"></div>
  </header>

  <main class="list-container" id="listContainer">
    <div id="list"></div>
  </main>

  <footer class="footer">
    <button class="btn primary" id="loginBtn" type="button">Войти</button>
    <button class="btn" id="syncBtn" type="button" disabled>Синх.</button>
  </footer>
</div>

<div id="noteModal" class="modal-backdrop hidden">
  <div class="modal">
    <div class="modal-title">Примечание <small id="noteModalDate"></small></div>
    <textarea id="noteModalTextarea" class="modal-textarea"
              placeholder="Самочувствие, погода, маршрут…"></textarea>
    <div class="modal-actions">
      <button class="btn" id="noteModalCancel" type="button">Отмена</button>
      <button class="btn primary" id="noteModalSave" type="button">Сохранить</button>
    </div>
  </div>
</div>

<script src="https://accounts.google.com/gsi/client" async defer></script>
<script>
(function () {
  'use strict';

  /* ============================================================
     ЗАМЕНИТЕ НА ВАШ CLIENT ID
     ============================================================ */
  const CLIENT_ID = '1044087401199-q5etiqllca476ndjbfkg8n5qds6bp2a1.apps.googleusercontent.com';

  const SCOPES = 'https://www.googleapis.com/auth/drive.appdata';
  const REMOTE_FILE_NAME = 'morning-runs.json';
  const STORE_KEY = 'morning-runs-v2';
  const START_DATE = { y: 2026, m: 9, d: 3 };

  const listEl = document.getElementById('list');
  const listContainer = document.getElementById('listContainer');
  const statusEl = document.getElementById('status');
  const loginBtn = document.getElementById('loginBtn');
  const syncBtn = document.getElementById('syncBtn');

  const noteModal = document.getElementById('noteModal');
  const noteModalDate = document.getElementById('noteModalDate');
  const noteModalTextarea = document.getElementById('noteModalTextarea');
  const noteModalSave = document.getElementById('noteModalSave');
  const noteModalCancel = document.getElementById('noteModalCancel');

  let data = loadData();
  let activeEditor = null;
  let scrollOnNextRender = true;

  let tokenClient = null;
  let accessToken = null;
  let remoteFileId = null;
  let tokenExpiresAt = 0;
  let accountEmail = '';

  /* ---------- утилиты ---------- */

  function keyOf(date) {
    const p = n => String(n).padStart(2, '0');
    return date.getFullYear() + '-' + p(date.getMonth() + 1) + '-' + p(date.getDate());
  }
  function todayKey() { return keyOf(new Date()); }
  function parseDateKey(key) {
    const [y, m, d] = key.split('-').map(Number);
    return new Date(y, m - 1, d);
  }
  function loadData() {
    try {
      const p = JSON.parse(localStorage.getItem(STORE_KEY) || '{}');
      return (p && typeof p === 'object' && !Array.isArray(p)) ? p : {};
    } catch (e) { return {}; }
  }
  function saveData() {
    try { localStorage.setItem(STORE_KEY, JSON.stringify(data)); } catch (e) {}
  }
  function formatDate(key) {
    const d = parseDateKey(key);
    const p = n => String(n).padStart(2, '0');
    const wd = ['вс','пн','вт','ср','чт','пт','сб'][d.getDay()];
    return p(d.getDate()) + '.' + p(d.getMonth() + 1) + '.' + d.getFullYear() + ' ' + wd;
  }
  function parseMeters(raw) {
    const digits = String(raw).replace(/\D/g, '');
    return digits === '' ? '' : String(parseInt(digits, 10));
  }
  function statusOf(rec) {
    const m = parseInt(String(rec.distance || '').replace(/\D/g, ''), 10);
    if (!isNaN(m) && m > 0) return 'green';
    if (String(rec.note || '').trim() !== '') return 'red';
    return 'yellow';
  }
  function setStatus(msg, isError) {
    statusEl.textContent = msg || '';
    statusEl.style.color = isError ? '#e05555' : '#6b7280';
  }

  function seedDates() {
    const today = new Date(); today.setHours(0, 0, 0, 0);
    const start = new Date(START_DATE.y, START_DATE.m, START_DATE.d);
    let added = false;
    for (let d = new Date(start); d <= today; d.setDate(d.getDate() + 1)) {
      const k = keyOf(d);
      if (!data[k]) { data[k] = { distance: '', note: '', updatedAt: 0 }; added = true; }
    }
    if (added) saveData();
  }

  /* ---------- отрисовка ---------- */

  function render() {
    listEl.innerHTML = '';
    const keys = Object.keys(data).sort();
    let prevDate = null;

    keys.forEach(key => {
      const d = parseDateKey(key);
      if (prevDate && prevDate.getDay() === 0 && d.getDay() === 1) {
        const div = document.createElement('div');
        div.className = 'week-divider';
        listEl.appendChild(div);
      }
      listEl.appendChild(buildRow(key, data[key]));
      prevDate = d;
    });

    if (scrollOnNextRender) {
      scrollOnNextRender = false;
      // прокручиваем контейнер к самому низу — виден последний день
      requestAnimationFrame(() => {
        listContainer.scrollTop = listContainer.scrollHeight;
      });
    }
  }

  function buildRow(key, rec) {
    const row = document.createElement('div');
    row.className = 'row ' + statusOf(rec);
    row.tabIndex = 0;
    row.dataset.key = key;

    const date = document.createElement('span');
    date.className = 'date' + (key === todayKey() ? ' today' : '');
    date.textContent = formatDate(key);

    const dist = document.createElement('span');
    const m = parseMeters(rec.distance);
    if (m && m !== '0') { dist.className = 'dist'; dist.textContent = m + ' м'; }
    else { dist.className = 'dist empty'; dist.textContent = '—'; }

    const note = document.createElement('span');
    const noteText = String(rec.note || '').trim();
    note.className = 'note' + (noteText ? '' : ' empty');
    note.textContent = noteText || '·';

    row.append(date, dist, note);

    row.addEventListener('click', () => onRowActivate(row, key));
    row.addEventListener('keydown', e => {
      if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); onRowActivate(row, key); }
    });

    return row;
  }

  function onRowActivate(row, key) {
    if (row.classList.contains('editing')) return;
    if (activeEditor) {
      const ok = activeEditor.commit();
      if (!ok) return;
      const fresh = listEl.querySelector('.row[data-key="' + key + '"]');
      if (fresh) startEdit(fresh, key);
      return;
    }
    startEdit(row, key);
  }

  /* ---------- модалка заметки ---------- */

  function openNoteModal(dateLabel, initialText, onSave) {
    noteModalDate.textContent = dateLabel ? '· ' + dateLabel : '';
    noteModalTextarea.value = initialText || '';
    noteModal.classList.remove('hidden');
    setTimeout(() => {
      noteModalTextarea.focus();
      noteModalTextarea.setSelectionRange(noteModalTextarea.value.length, noteModalTextarea.value.length);
    }, 30);

    function close() {
      noteModal.classList.add('hidden');
      noteModalSave.removeEventListener('click', onSaveClick);
      noteModalCancel.removeEventListener('click', onCancelClick);
      noteModalTextarea.removeEventListener('keydown', onKeyDown);
      noteModal.removeEventListener('click', onBackdropClick);
      setTimeout(() => { if (activeEditor) activeEditor.commit(); }, 50);
    }
    function onSaveClick() { onSave(noteModalTextarea.value.trim()); close(); }
    function onCancelClick() { close(); }
    function onKeyDown(e) {
      if (e.key === 'Escape') { e.preventDefault(); onCancelClick(); }
      if (e.key === 'Enter' && (e.ctrlKey || e.metaKey)) { e.preventDefault(); onSaveClick(); }
    }
    function onBackdropClick(e) { if (e.target === noteModal) onCancelClick(); }

    noteModalSave.addEventListener('click', onSaveClick);
    noteModalCancel.addEventListener('click', onCancelClick);
    noteModalTextarea.addEventListener('keydown', onKeyDown);
    noteModal.addEventListener('click', onBackdropClick);
  }

  /* ---------- редактирование строки (без кнопки OK) ---------- */

  function startEdit(row, key) {
    if (row.classList.contains('editing')) return;
    const rec = data[key] || { distance: '', note: '', updatedAt: 0 };
    row.classList.add('editing');
    row.innerHTML = '';

    const date = document.createElement('span');
    date.className = 'date' + (key === todayKey() ? ' today' : '');
    date.textContent = formatDate(key);

    const distInput = document.createElement('input');
    distInput.className = 'inp dist-inp';
    distInput.type = 'text'; distInput.inputMode = 'numeric';
    distInput.value = rec.distance || '';

    const noteTrigger = document.createElement('div');
    noteTrigger.className = 'inp note-inp note-trigger';
    noteTrigger.tabIndex = 0;
    noteTrigger.setAttribute('role', 'button');
    let noteValue = String(rec.note || '');
    function updateNoteTrigger() {
      const t = noteValue.trim();
      noteTrigger.textContent = t || 'Примечание…';
      noteTrigger.classList.toggle('empty', !t);
    }
    updateNoteTrigger();

    function openNote() {
      openNoteModal(formatDate(key), noteValue, txt => {
        noteValue = txt;
        updateNoteTrigger();
      });
    }
    noteTrigger.addEventListener('click', e => { e.stopPropagation(); openNote(); });
    noteTrigger.addEventListener('keydown', e => {
      if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); e.stopPropagation(); openNote(); }
    });

    const cancelBtn = document.createElement('button');
    cancelBtn.type = 'button'; cancelBtn.className = 'btn'; cancelBtn.textContent = '×';

    row.append(date, distInput, noteTrigger, cancelBtn);
    distInput.focus(); distInput.select();

    function commit() {
      const raw = distInput.value.trim();
      if (raw !== '' && !/^\d+$/.test(raw)) {
        distInput.classList.add('invalid'); distInput.focus(); return false;
      }
      data[key] = {
        distance: parseMeters(raw),
        note: noteValue.trim(),
        updatedAt: Date.now()
      };
      activeEditor = null;
      saveData();
      if (accessToken) syncToDrive(true);
      render();
      return true;
    }
    function cancel() { activeEditor = null; render(); }

    activeEditor = { row, commit, cancel };

    cancelBtn.addEventListener('click', e => { e.stopPropagation(); cancel(); });

    distInput.addEventListener('click', e => e.stopPropagation());
    distInput.addEventListener('keydown', e => {
      e.stopPropagation();
      if (e.key === 'Enter')  { e.preventDefault(); commit(); }
      if (e.key === 'Escape') { e.preventDefault(); cancel(); }
    });
    distInput.addEventListener('input', () => distInput.classList.remove('invalid'));

    row.addEventListener('focusout', () => {
      setTimeout(() => {
        if (!activeEditor || activeEditor.row !== row) return;
        if (row.contains(document.activeElement)) return;
        if (!noteModal.classList.contains('hidden')) return;
        commit();
      }, 120);
    });
  }

  /* ============================================================
     Слияние данных
     ============================================================ */

  function pickBetter(local, remote) {
    const lT = Number(local.updatedAt) || 0;
    const rT = Number(remote.updatedAt) || 0;

    if (lT > 0 && rT > 0) {
      const winner = lT >= rT ? local : remote;
      return {
        distance: String(winner.distance || '').replace(/\D/g, ''),
        note: String(winner.note || '').trim(),
        updatedAt: Math.max(lT, rT)
      };
    }
    if (lT > 0) {
      return {
        distance: String(local.distance || '').replace(/\D/g, ''),
        note: String(local.note || '').trim(),
        updatedAt: lT
      };
    }
    if (rT > 0) {
      return {
        distance: String(remote.distance || '').replace(/\D/g, ''),
        note: String(remote.note || '').trim(),
        updatedAt: rT
      };
    }

    const lDist = String(local.distance || '').replace(/\D/g, '');
    const rDist = String(remote.distance || '').replace(/\D/g, '');
    const lNote = String(local.note || '').trim();
    const rNote = String(remote.note || '').trim();
    return {
      distance: lDist || rDist,
      note: lNote || rNote,
      updatedAt: (lDist || lNote || rDist || rNote) ? Date.now() : 0
    };
  }

  /* ============================================================
     GOOGLE DRIVE
     ============================================================ */

  function initTokenClient() {
    if (tokenClient) return;
    if (!window.google || !google.accounts || !google.accounts.oauth2) return;

    tokenClient = google.accounts.oauth2.initTokenClient({
      client_id: CLIENT_ID,
      scope: SCOPES,
      auto_select: true,
      callback: handleTokenResponse
    });
  }

  async function fetchAccountEmail() {
    try {
      const res = await fetch('https://www.googleapis.com/drive/v3/about?fields=user', {
        headers: { Authorization: 'Bearer ' + accessToken },
        cache: 'no-store'
      });
      if (!res.ok) return '';
      const j = await res.json();
      return (j.user && j.user.emailAddress) || '';
    } catch (e) { return ''; }
  }

  async function handleTokenResponse(resp) {
    if (resp.error) {
      if (resp.error === 'interaction_required' || resp.error === 'login_required') {
        setStatus('Нажмите «Войти» для подключения к Google.');
        loginBtn.classList.add('attention');
        return;
      }
      if (resp.error === 'access_denied') { setStatus('Доступ отклонён.', true); return; }
      if (resp.error === 'popup_closed_by_user') { setStatus('Окно входа закрыто.'); return; }
      if (resp.error === 'origin_mismatch') {
        setStatus('origin_mismatch: добавьте ' + window.location.origin + ' в Authorized JavaScript origins.', true);
        return;
      }
      setStatus('Ошибка входа: ' + resp.error, true);
      console.error('OAuth error:', resp);
      return;
    }

    accessToken = resp.access_token;
    tokenExpiresAt = Date.now() + (resp.expires_in ? resp.expires_in * 1000 : 3600 * 1000);
    try { localStorage.setItem('oauth_remember', '1'); } catch (e) {}

    loginBtn.classList.remove('attention');
    loginBtn.disabled = true;
    syncBtn.disabled = false;

    accountEmail = await fetchAccountEmail();
    setStatus('Вход: ' + (accountEmail || 'аккаунт Google') + '\nЗагружаю данные…');
    syncFromDrive();
  }

  window.addEventListener('load', () => {
    const check = setInterval(() => {
      if (window.google && google.accounts && google.accounts.oauth2) {
        initTokenClient();
        clearInterval(check);
        if (localStorage.getItem('oauth_remember') === '1') {
          try { tokenClient.requestAccessToken({ prompt: 'none' }); }
          catch (e) { console.warn('Silent login failed:', e); }
        }
      }
    }, 200);

    setTimeout(() => {
      if (!tokenClient) setStatus('Не удалось загрузить Google Identity Services.', true);
    }, 10000);
  });

  function ensureToken() {
    if (!accessToken) return false;
    if (Date.now() >= tokenExpiresAt - 60000) {
      accessToken = null;
      loginBtn.disabled = false;
      syncBtn.disabled = true;
      loginBtn.classList.add('attention');
      setStatus('Сессия истекла. Нажмите «Войти».');
      return false;
    }
    return true;
  }

  async function findAllRemoteFiles() {
    const q = encodeURIComponent("name='" + REMOTE_FILE_NAME + "' and 'appDataFolder' in parents and trashed=false");
    const url = 'https://www.googleapis.com/drive/v3/files?spaces=appDataFolder&q=' + q +
                '&fields=files(id,name,modifiedTime,size)&orderBy=modifiedTime desc';
    const res = await fetch(url, {
      headers: { Authorization: 'Bearer ' + accessToken },
      cache: 'no-store'
    });
    if (!res.ok) throw new Error('Ошибка поиска файлов: ' + res.status);
    const json = await res.json();
    return json.files || [];
  }

  async function syncFromDrive() {
    if (!ensureToken()) return;
    setStatus('Загрузка с Google Диска…');
    try {
      const files = await findAllRemoteFiles();
      const merged = { ...data };
      for (const f of files) {
        try {
          const res = await fetch('https://www.googleapis.com/drive/v3/files/' + f.id + '?alt=media', {
            headers: { Authorization: 'Bearer ' + accessToken },
            cache: 'no-store'
          });
          if (!res.ok) continue;
          const doc = await res.json();
          Object.keys(doc || {}).forEach(k => {
            const local = merged[k] || { distance: '', note: '', updatedAt: 0 };
            const rem = doc[k] || { distance: '', note: '', updatedAt: 0 };
            merged[k] = pickBetter(local, rem);
          });
        } catch (e) { console.warn('Не удалось скачать', f.id, e); }
      }

      data = merged;
      seedDates();
      saveData();
      render();

      if (files.length > 1) {
        remoteFileId = files[0].id;
        for (let i = 1; i < files.length; i++) {
          try {
            await fetch('https://www.googleapis.com/drive/v3/files/' + files[i].id, {
              method: 'DELETE',
              headers: { Authorization: 'Bearer ' + accessToken }
            });
          } catch (e) {}
        }
        setStatus('Синхронизировано. Было ' + files.length + ' файлов, объединены в 1.');
      } else if (files.length === 1) {
        remoteFileId = files[0].id;
        setStatus('Синхронизировано с Google Диском.');
      } else {
        remoteFileId = null;
        setStatus('Файл не найден. Создаю новый…');
      }

      await syncToDrive(true);
    } catch (e) {
      setStatus('Ошибка загрузки: ' + e.message, true);
    }
  }

  async function syncToDrive(silent) {
    if (!ensureToken()) return;
    if (!silent) setStatus('Сохранение на Google Диск…');
    try {
      const files = await findAllRemoteFiles();
      if (files.length > 0) remoteFileId = files[0].id;
      else remoteFileId = null;

      const body = JSON.stringify(data, null, 2);

      if (remoteFileId) {
        const res = await fetch('https://www.googleapis.com/upload/drive/v3/files/' + remoteFileId + '?uploadType=media', {
          method: 'PATCH',
          headers: { Authorization: 'Bearer ' + accessToken, 'Content-Type': 'application/json' },
          body: body,
          cache: 'no-store'
        });
        if (res.status === 404) {
          remoteFileId = null;
          return syncToDrive(silent);
        }
        if (!res.ok) throw new Error('Ошибка обновления: ' + res.status);
      } else {
        const boundary = '-------morning-runs-' + Date.now();
        const metadata = { name: REMOTE_FILE_NAME, parents: ['appDataFolder'] };
        const multipart =
          '--' + boundary + '\r\n' +
          'Content-Type: application/json; charset=UTF-8\r\n\r\n' +
          JSON.stringify(metadata) + '\r\n' +
          '--' + boundary + '\r\n' +
          'Content-Type: application/json\r\n\r\n' +
          body + '\r\n' +
          '--' + boundary + '--';

        const res = await fetch('https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart&fields=id', {
          method: 'POST',
          headers: {
            Authorization: 'Bearer ' + accessToken,
            'Content-Type': 'multipart/related; boundary=' + boundary
          },
          body: multipart,
          cache: 'no-store'
        });
        if (!res.ok) throw new Error('Ошибка создания: ' + res.status);
        const json = await res.json();
        remoteFileId = json.id;
      }
      if (!silent) setStatus('Сохранено на Google Диск.');
    } catch (e) {
      setStatus('Ошибка сохранения: ' + e.message, true);
    }
  }

  /* ---------- кнопки ---------- */

  loginBtn.addEventListener('click', () => {
    if (!tokenClient) { setStatus('Google Identity Services ещё не загружен.', true); return; }
    loginBtn.classList.remove('attention');
    tokenClient.requestAccessToken();
  });

  syncBtn.addEventListener('click', () => {
    if (!accessToken) {
      setStatus('Нужно войти в Google. Нажмите «Войти».');
      loginBtn.classList.add('attention');
      return;
    }
    if (Date.now() >= tokenExpiresAt - 60000) {
      accessToken = null;
      loginBtn.disabled = false;
      syncBtn.disabled = true;
      loginBtn.classList.add('attention');
      setStatus('Сессия истекла. Нажмите «Войти».');
      return;
    }
    syncFromDrive();
  });

  /* ---------- запуск ---------- */

  seedDates();
  render();

  let lastKey = todayKey();
  setInterval(() => {
    const k = todayKey();
    if (k !== lastKey) {
      lastKey = k;
      seedDates();
      if (!activeEditor) render();
    }
  }, 30000);

  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('./sw.js').then(reg => {
        try { reg.update(); } catch (e) {}
      }).catch(err => console.warn('SW не зарегистрирован:', err));
    });
  }
})();
</script>
</body>
</html>
