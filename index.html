<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Утренние пробежки</title>

<!-- PWA -->
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#14181f">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Пробежки">

<style>
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0;
    background: #14181f;
  }
  body {
    padding: 20px 12px calc(60px + env(safe-area-inset-bottom));
    padding-top: calc(20px + env(safe-area-inset-top));
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
    background: #14181f; color: #e5e9ef;
    -webkit-font-smoothing: antialiased;
    -webkit-tap-highlight-color: transparent;
  }
  .wrap { max-width: 720px; margin: 0 auto; }
  .head {
    display: flex; align-items: center; justify-content: space-between;
    gap: 12px; margin-bottom: 12px; flex-wrap: wrap;
  }
  h1 { font-size: 17px; margin: 0; letter-spacing: -.2px; }
  .head-actions { display: flex; gap: 6px; flex-wrap: wrap; }
  .head-actions .btn { font-size: 12px; padding: 4px 10px; }
  .status { font-size: 11px; color: #6b7280; margin-left: 4px; min-height: 14px; }

  .row {
    display: flex; align-items: center; gap: 10px;
    padding: 8px 10px; margin-bottom: 4px;
    border-radius: 6px; border-left: 4px solid transparent;
    font-size: 14px; line-height: 1.2;
    cursor: pointer; user-select: none;
    transition: box-shadow .12s ease, background .12s ease;
  }
  .row:hover { box-shadow: 0 2px 10px rgba(0,0,0,.4); }
  .row:focus-visible { outline: 2px solid #4a8bff; outline-offset: 1px; }
  .row.yellow { background: #3b3416; border-left-color: #d4a900; }
  .row.green  { background: #163a22; border-left-color: #35b85a; }
  .row.red    { background: #3d1c1c; border-left-color: #e05555; }
  .row.editing {
    background: #232a34; border-left-color: #64748b;
    cursor: default; padding: 6px 8px;
    box-shadow: 0 3px 14px rgba(0,0,0,.5);
  }

  .date { flex: 0 0 132px; font-weight: 600; color: #c7cfda; white-space: nowrap; }
  .date.today { color: #6ea8ff; }
  .dist {
    flex: 0 0 84px; text-align: right; font-weight: 600;
    font-variant-numeric: tabular-nums; white-space: nowrap;
  }
  .dist.empty { color: #5f6875; font-weight: 400; }
  .note {
    flex: 1 1 auto; color: #b6bec9;
    overflow: hidden; text-overflow: ellipsis;
    white-space: nowrap; min-width: 0;
  }
  .note.empty { color: transparent; }
  .week-divider { height: 1px; background: #3a4250; margin: 10px 4px; }

  .inp {
    font: inherit; font-size: 14px; padding: 6px 8px;
    border: 1px solid #3a4250; border-radius: 5px;
    background: #1a1f27; color: #e5e9ef; min-width: 0;
  }
  .inp:focus {
    outline: none; border-color: #4a8bff;
    box-shadow: 0 0 0 2px rgba(74,139,255,.25);
  }
  .inp.invalid { border-color: #e05555; box-shadow: 0 0 0 2px rgba(224,85,85,.25); }
  .inp.dist-inp { flex: 0 0 84px; text-align: right; }
  .inp.note-inp { flex: 1 1 auto; }

  .btn {
    font: inherit; font-size: 13px; font-weight: 600;
    padding: 5px 11px; border-radius: 5px;
    border: 1px solid #3a4250; background: #232a34;
    color: #c7cfda; cursor: pointer; white-space: nowrap;
  }
  .btn:hover { background: #2b3340; }
  .btn.primary { background: #2f6fdd; border-color: #2f6fdd; color: #fff; }
  .btn.primary:hover { background: #3b7ce6; }
  .btn:disabled { opacity: .5; cursor: not-allowed; }

  /* небольшой адаптив под узкие экраны телефона */
  @media (max-width: 480px) {
    .date { flex: 0 0 108px; font-size: 13px; }
    .dist { flex: 0 0 68px; font-size: 13px; }
    .note { font-size: 13px; }
    .head-actions .btn { font-size: 11px; padding: 4px 8px; }
  }
</style>
</head>
<body>
<div class="wrap">
  <div class="head">
    <h1>Утренние пробежки</h1>
    <div class="head-actions">
      <button class="btn" id="loginBtn" type="button">Войти</button>
      <button class="btn" id="syncBtn" type="button" disabled>Синх.</button>
      <button class="btn" id="logoutBtn" type="button" disabled>Выйти</button>
      <button class="btn" id="exportBtn" type="button">Экспорт</button>
      <button class="btn" id="importBtn" type="button">Импорт</button>
      <input type="file" id="importFile" accept="application/json,.json" hidden>
    </div>
  </div>
  <div id="status" class="status"></div>
  <div id="list"></div>
</div>

<script src="https://accounts.google.com/gsi/client" async defer></script>
<script>
(function () {
  'use strict';

  /* ============================================================
     ЗАМЕНИТЕ НА ВАШ CLIENT ID ИЗ GOOGLE CLOUD CONSOLE
     ============================================================ */
  const CLIENT_ID = '1044087401199-q5etiqllca476ndjbfkg8n5qds6bp2a1.apps.googleusercontent.com';

  const SCOPES = 'https://www.googleapis.com/auth/drive.appdata';
  const REMOTE_FILE_NAME = 'morning-runs.json';
  const STORE_KEY = 'morning-runs-v2';
  const START_DATE = { y: 2026, m: 9, d: 3 };

  const listEl = document.getElementById('list');
  const statusEl = document.getElementById('status');
  const loginBtn = document.getElementById('loginBtn');
  const syncBtn = document.getElementById('syncBtn');
  const logoutBtn = document.getElementById('logoutBtn');
  const exportBtn = document.getElementById('exportBtn');
  const importBtn = document.getElementById('importBtn');
  const importFile = document.getElementById('importFile');

  let data = loadData();
  let activeEditor = null;
  let scrollOnNextRender = true;

  let tokenClient = null;
  let accessToken = null;
  let remoteFileId = null;
  let tokenExpiresAt = 0;

  /* ---------- утилиты ---------- */

  function keyOf(date) {
    const p = n => String(n).padStart(2, '0');
    return date.getFullYear() + '-' + p(date.getMonth() + 1) + '-' + p(date.getDate());
  }
  function todayKey() { return keyOf(new Date()); }
  function parseDateKey(key) {
    const [y, m, d] = key.split('-').map(Number);
    return new Date(y, m - 1, d);
  }
  function loadData() {
    try {
      const p = JSON.parse(localStorage.getItem(STORE_KEY) || '{}');
      return (p && typeof p === 'object' && !Array.isArray(p)) ? p : {};
    } catch (e) { return {}; }
  }
  function saveData() {
    try { localStorage.setItem(STORE_KEY, JSON.stringify(data)); } catch (e) {}
  }
  function formatDate(key) {
    const d = parseDateKey(key);
    const p = n => String(n).padStart(2, '0');
    const wd = ['вс','пн','вт','ср','чт','пт','сб'][d.getDay()];
    return p(d.getDate()) + '.' + p(d.getMonth() + 1) + '.' + d.getFullYear() + ' ' + wd;
  }
  function parseMeters(raw) {
    const digits = String(raw).replace(/\D/g, '');
    return digits === '' ? '' : String(parseInt(digits, 10));
  }
  function statusOf(rec) {
    const m = parseInt(String(rec.distance || '').replace(/\D/g, ''), 10);
    if (!isNaN(m) && m > 0) return 'green';
    if (String(rec.note || '').trim() !== '') return 'red';
    return 'yellow';
  }
  function setStatus(msg, isError) {
    statusEl.textContent = msg || '';
    statusEl.style.color = isError ? '#e05555' : '#6b7280';
  }

  /* ---------- ежедневное наполнение ---------- */

  function seedDates() {
    const today = new Date(); today.setHours(0, 0, 0, 0);
    const start = new Date(START_DATE.y, START_DATE.m, START_DATE.d);
    let added = false;
    for (let d = new Date(start); d <= today; d.setDate(d.getDate() + 1)) {
      const k = keyOf(d);
      if (!data[k]) { data[k] = { distance: '', note: '' }; added = true; }
    }
    if (added) saveData();
  }

  /* ---------- отрисовка ---------- */

  function render() {
    listEl.innerHTML = '';
    const keys = Object.keys(data).sort();
    let prevDate = null;

    keys.forEach(key => {
      const d = parseDateKey(key);
      if (prevDate && prevDate.getDay() === 0 && d.getDay() === 1) {
        const div = document.createElement('div');
        div.className = 'week-divider';
        listEl.appendChild(div);
      }
      listEl.appendChild(buildRow(key, data[key]));
      prevDate = d;
    });

    if (scrollOnNextRender) {
      scrollOnNextRender = false;
      requestAnimationFrame(() => {
        const last = listEl.lastElementChild;
        if (last && last.scrollIntoView) last.scrollIntoView({ block: 'nearest' });
      });
    }
  }

  function buildRow(key, rec) {
    const row = document.createElement('div');
    row.className = 'row ' + statusOf(rec);
    row.tabIndex = 0;
    row.dataset.key = key;

    const date = document.createElement('span');
    date.className = 'date' + (key === todayKey() ? ' today' : '');
    date.textContent = formatDate(key);

    const dist = document.createElement('span');
    const m = parseMeters(rec.distance);
    if (m && m !== '0') { dist.className = 'dist'; dist.textContent = m + ' м'; }
    else { dist.className = 'dist empty'; dist.textContent = '—'; }

    const note = document.createElement('span');
    const noteText = String(rec.note || '').trim();
    note.className = 'note' + (noteText ? '' : ' empty');
    note.textContent = noteText || '·';

    row.append(date, dist, note);

    row.addEventListener('click', () => onRowActivate(row, key));
    row.addEventListener('keydown', e => {
      if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); onRowActivate(row, key); }
    });

    return row;
  }

  function onRowActivate(row, key) {
    if (row.classList.contains('editing')) return;
    if (activeEditor) {
      const ok = activeEditor.commit();
      if (!ok) return;
      const fresh = listEl.querySelector('.row[data-key="' + key + '"]');
      if (fresh) startEdit(fresh, key);
      return;
    }
    startEdit(row, key);
  }

  function startEdit(row, key) {
    if (row.classList.contains('editing')) return;
    const rec = data[key] || { distance: '', note: '' };
    row.classList.add('editing');
    row.innerHTML = '';

    const date = document.createElement('span');
    date.className = 'date' + (key === todayKey() ? ' today' : '');
    date.textContent = formatDate(key);

    const distInput = document.createElement('input');
    distInput.className = 'inp dist-inp';
    distInput.type = 'text'; distInput.inputMode = 'numeric';
    distInput.value = rec.distance || '';

    const noteInput = document.createElement('input');
    noteInput.className = 'inp note-inp';
    noteInput.type = 'text';
    noteInput.value = rec.note || '';

    const saveBtn = document.createElement('button');
    saveBtn.type = 'button'; saveBtn.className = 'btn primary'; saveBtn.textContent = 'OK';

    const cancelBtn = document.createElement('button');
    cancelBtn.type = 'button'; cancelBtn.className = 'btn'; cancelBtn.textContent = '×';

    row.append(date, distInput, noteInput, saveBtn, cancelBtn);
    distInput.focus(); distInput.select();

    function commit() {
      const raw = distInput.value.trim();
      if (raw !== '' && !/^\d+$/.test(raw)) {
        distInput.classList.add('invalid'); distInput.focus(); return false;
      }
      data[key] = { distance: parseMeters(raw), note: noteInput.value.trim() };
      activeEditor = null;
      saveData();
      if (accessToken) syncToDrive(true);
      render();
      return true;
    }
    function cancel() { activeEditor = null; render(); }

    activeEditor = { row, commit, cancel };

    saveBtn.addEventListener('click', e => { e.stopPropagation(); commit(); });
    cancelBtn.addEventListener('click', e => { e.stopPropagation(); cancel(); });

    [distInput, noteInput].forEach(inp => {
      inp.addEventListener('click', e => e.stopPropagation());
      inp.addEventListener('keydown', e => {
        e.stopPropagation();
        if (e.key === 'Enter')  { e.preventDefault(); commit(); }
        if (e.key === 'Escape') { e.preventDefault(); cancel(); }
      });
      inp.addEventListener('keypress', e => e.stopPropagation());
      inp.addEventListener('input', () => inp.classList.remove('invalid'));
    });
  }

  /* ============================================================
     GOOGLE DRIVE
     ============================================================ */

  function initTokenClient() {
    if (tokenClient) return;
    if (!window.google || !google.accounts || !google.accounts.oauth2) return;

    tokenClient = google.accounts.oauth2.initTokenClient({
      client_id: CLIENT_ID,
      scope: SCOPES,
      auto_select: true,
      callback: handleTokenResponse
    });
  }

  function handleTokenResponse(resp) {
    if (resp.error) {
      if (resp.error === 'interaction_required' || resp.error === 'login_required') {
        setStatus('Нажмите «Войти» для подключения к Google.');
        return;
      }
      if (resp.error === 'access_denied') { setStatus('Доступ отклонён.', true); return; }
      if (resp.error === 'popup_closed_by_user') { setStatus('Окно входа закрыто.'); return; }
      if (resp.error === 'origin_mismatch') {
        setStatus('origin_mismatch: добавьте ' + window.location.origin + ' в Authorized JavaScript origins.', true);
        return;
      }
      setStatus('Ошибка входа: ' + resp.error, true);
      console.error('OAuth error:', resp);
      return;
    }

    accessToken = resp.access_token;
    tokenExpiresAt = Date.now() + (resp.expires_in ? resp.expires_in * 1000 : 3600 * 1000);
    try { localStorage.setItem('oauth_remember', '1'); } catch (e) {}

    setStatus('Вы вошли. Загружаю данные…');
    loginBtn.disabled = true;
    syncBtn.disabled = false;
    logoutBtn.disabled = false;
    syncFromDrive();
  }

  window.addEventListener('load', () => {
    const check = setInterval(() => {
      if (window.google && google.accounts && google.accounts.oauth2) {
        initTokenClient();
        clearInterval(check);
        if (localStorage.getItem('oauth_remember') === '1') {
          try { tokenClient.requestAccessToken({ prompt: 'none' }); }
          catch (e) { console.warn('Auto-login failed:', e); }
        }
      }
    }, 200);

    setTimeout(() => {
      if (!tokenClient) setStatus('Не удалось загрузить Google Identity Services.', true);
    }, 10000);
  });

  function ensureToken() {
    if (!accessToken) return false;
    if (Date.now() >= tokenExpiresAt - 60000) {
      setStatus('Сессия истекла. Нажмите «Синхронизировать» ещё раз.', true);
      accessToken = null;
      loginBtn.disabled = false;
      syncBtn.disabled = true;
      logoutBtn.disabled = true;
      return false;
    }
    return true;
  }

  async function findRemoteFile() {
    const q = encodeURIComponent("name='" + REMOTE_FILE_NAME + "' and 'appDataFolder' in parents and trashed=false");
    const url = 'https://www.googleapis.com/drive/v3/files?spaces=appDataFolder&q=' + q + '&fields=files(id,name,modifiedTime)';
    const res = await fetch(url, { headers: { Authorization: 'Bearer ' + accessToken } });
    if (!res.ok) throw new Error('Ошибка поиска файла: ' + res.status);
    const json = await res.json();
    return (json.files && json.files.length) ? json.files[0] : null;
  }

  async function syncFromDrive() {
    if (!ensureToken()) return;
    setStatus('Загрузка с Google Диска…');
    try {
      const file = await findRemoteFile();
      if (!file) {
        setStatus('Файл на Диске не найден. Создаю…');
        await syncToDrive(false);
        return;
      }
      remoteFileId = file.id;
      const res = await fetch('https://www.googleapis.com/drive/v3/files/' + file.id + '?alt=media', {
        headers: { Authorization: 'Bearer ' + accessToken }
      });
      if (!res.ok) throw new Error('Ошибка скачивания: ' + res.status);
      const remote = await res.json();

      const merged = { ...data };
      Object.keys(remote).forEach(k => {
        const r = remote[k] || {};
        const local = merged[k] || { distance: '', note: '' };
        const rM = parseInt(String(r.distance || '').replace(/\D/g, ''), 10);
        const lM = parseInt(String(local.distance || '').replace(/\D/g, ''), 10);
        if (!isNaN(rM) && rM > 0 && (isNaN(lM) || lM === 0)) {
          merged[k] = { distance: String(rM), note: String(r.note || '').trim() };
        } else if (isNaN(lM) || lM === 0) {
          const rNote = String(r.note || '').trim();
          const lNote = String(local.note || '').trim();
          if (!lNote && rNote) merged[k] = { distance: '', note: rNote };
        }
      });
      data = merged;
      seedDates();
      saveData();
      render();
      setStatus('Данные загружены с Google Диска.');
      await syncToDrive(true);
    } catch (e) {
      setStatus('Ошибка загрузки: ' + e.message, true);
    }
  }

  async function syncToDrive(silent) {
    if (!ensureToken()) return;
    if (!silent) setStatus('Сохранение на Google Диск…');
    try {
      if (!remoteFileId) {
        const f = await findRemoteFile();
        if (f) remoteFileId = f.id;
      }
      const body = JSON.stringify(data, null, 2);

      if (remoteFileId) {
        const res = await fetch('https://www.googleapis.com/upload/drive/v3/files/' + remoteFileId + '?uploadType=media', {
          method: 'PATCH',
          headers: { Authorization: 'Bearer ' + accessToken, 'Content-Type': 'application/json' },
          body: body
        });
        if (!res.ok) throw new Error('Ошибка обновления: ' + res.status);
      } else {
        const boundary = '-------morning-runs-' + Date.now();
        const metadata = { name: REMOTE_FILE_NAME, parents: ['appDataFolder'] };
        const multipart =
          '--' + boundary + '\r\n' +
          'Content-Type: application/json; charset=UTF-8\r\n\r\n' +
          JSON.stringify(metadata) + '\r\n' +
          '--' + boundary + '\r\n' +
          'Content-Type: application/json\r\n\r\n' +
          body + '\r\n' +
          '--' + boundary + '--';

        const res = await fetch('https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart&fields=id', {
          method: 'POST',
          headers: {
            Authorization: 'Bearer ' + accessToken,
            'Content-Type': 'multipart/related; boundary=' + boundary
          },
          body: multipart
        });
        if (!res.ok) throw new Error('Ошибка создания: ' + res.status);
        const json = await res.json();
        remoteFileId = json.id;
      }
      if (!silent) setStatus('Сохранено на Google Диск.');
    } catch (e) {
      setStatus('Ошибка сохранения: ' + e.message, true);
    }
  }

  /* ---------- кнопки ---------- */

  loginBtn.addEventListener('click', () => {
    if (!tokenClient) { setStatus('Google Identity Services ещё не загружен.', true); return; }
    tokenClient.requestAccessToken();
  });

  syncBtn.addEventListener('click', () => {
    if (!accessToken) { tokenClient.requestAccessToken(); return; }
    syncFromDrive();
  });

  logoutBtn.addEventListener('click', () => {
    if (accessToken && window.google && google.accounts && google.accounts.oauth2) {
      google.accounts.oauth2.revoke(accessToken, () => {});
    }
    accessToken = null; remoteFileId = null; tokenExpiresAt = 0;
    try { localStorage.removeItem('oauth_remember'); } catch (e) {}
    loginBtn.disabled = false;
    syncBtn.disabled = true;
    logoutBtn.disabled = true;
    setStatus('Вы вышли. Данные остаются в браузере.');
  });

  exportBtn.addEventListener('click', () => {
    if (activeEditor) activeEditor.commit();
    const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    const d = new Date(); const p = n => String(n).padStart(2, '0');
    a.href = url;
    a.download = 'пробежки-' + d.getFullYear() + '-' + p(d.getMonth() + 1) + '-' + p(d.getDate()) + '.json';
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 1000);
  });

  importBtn.addEventListener('click', () => importFile.click());

  importFile.addEventListener('change', e => {
    const file = e.target.files && e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = () => {
      try {
        const parsed = JSON.parse(reader.result);
        if (!parsed || typeof parsed !== 'object' || Array.isArray(parsed)) throw new Error('Неверный формат');
        if (!confirm('Заменить текущие данные данными из файла?')) return;
        const clean = {};
        Object.keys(parsed).forEach(k => {
          const r = parsed[k] || {};
          clean[k] = { distance: parseMeters(r.distance || ''), note: String(r.note || '').trim() };
        });
        data = clean; saveData(); seedDates(); render();
        if (accessToken) syncToDrive(true);
      } catch (err) {
        alert('Не удалось прочитать файл: ' + err.message);
      } finally {
        importFile.value = '';
      }
    };
    reader.readAsText(file);
  });

  /* ---------- запуск ---------- */

  seedDates();
  render();

  let lastKey = todayKey();
  setInterval(() => {
    const k = todayKey();
    if (k !== lastKey) {
      lastKey = k;
      seedDates();
      if (!activeEditor) render();
    }
  }, 30000);

  /* ---------- регистрация service worker (для PWA) ---------- */

  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('./sw.js')
        .catch(err => console.warn('SW не зарегистрирован:', err));
    });
  }
})();
</script>
</body>
</html>
